spring:
  application:
    name: AICodeGenerate
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
  # redis
  data:
    redis:
      host: localhost
      port: 6379
      password:
      ttl: 3600
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/marcus_ai_code
    username: xxx
    password: xxxxxx
  profiles:
    active: local

server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000

# AI
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      api-key: <Your API Key>
      model-name: deepseek-chat
      log-requests: true
      log-responses: true
      max-tokens: 8192
      strict-json-schema: true
      response-format: json_object
    # 流式输出
    streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: <Your API Key>
      model-name: deepseek-chat
      max-tokens: 8192
      log-requests: true
      log-responses: true

# 应用访问地址
app:
  deploy:
    # 可通过环境变量 APP_DEPLOY_BASE_URL 覆盖，不要以 / 结尾
    base-url: ${APP_DEPLOY_BASE_URL:http://localhost/api/static}


# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.marcuschu.aicodegenerate.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
